name: CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect runtime changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            runtime:
              - '**'
              - '!**/*.md'
              - '!**/*.markdown'
              - '!**/*.mdx'
              - '!docs/**'

  shell:
    name: Shell tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          set -euo pipefail
          for script in start.sh tests/test_mode.sh tests/test_reload.sh tests/test_container.sh; do
            bash -n "$script"
          done

      - name: Run mode tests
        run: bash tests/test_mode.sh

      - name: Run reload tests
        run: bash tests/test_reload.sh

  smoke:
    name: AMD64 runtime smoke
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: clash4docker-ci:amd64
          load: true
          push: false

      - name: Run AMD64 container smoke test
        run: bash tests/test_container.sh clash4docker-ci:amd64

  build:
    name: Build ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=cacheonly

  ci-gate:
    name: CI Gate
    needs:
      - changes
      - shell
      - smoke
      - build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate validation stages
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHELL_RESULT: ${{ needs.shell.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
        run: |
          set -u

          failed=0

          report_stage() {
            local stage="$1"
            local actual="$2"
            local expected="$3"

            printf '%s: %s (expected %s)\n' "$stage" "$actual" "$expected"
            if [ "$actual" != "$expected" ]; then
              printf 'CI Gate failure in %s: got %s, expected %s\n' "$stage" "$actual" "$expected" >&2
              failed=1
            fi
          }

          report_stage "changes" "$CHANGES_RESULT" "success"
          report_stage "shell" "$SHELL_RESULT" "success"

          case "$RUNTIME_CHANGED" in
            true)
              report_stage "AMD64 runtime smoke" "$SMOKE_RESULT" "success"
              report_stage "platform builds" "$BUILD_RESULT" "success"
              ;;
            false)
              report_stage "AMD64 runtime smoke" "$SMOKE_RESULT" "skipped"
              report_stage "platform builds" "$BUILD_RESULT" "skipped"
              ;;
            *)
              printf 'CI Gate failure in changes: runtime classification is unexpected: %s\n' "$RUNTIME_CHANGED" >&2
              failed=1
              ;;
          esac

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          printf 'CI Gate passed\n'
